# TrueNorth check model — the ONLY file this repo owns to drive its CI
# (FR-58: the truenorth.yaml / check-selection file, adjacent to catalog-info.yaml).
# Java/Gradle scaffold — build via dagger-checks-java (maven toolchain,
# temurin JDK; gradle repos MUST declare hooks).
#
# Check model (FR-58/FR-59):
#   mode: required   — always on, can never be disabled or downgraded (PII, secrets).
#   mode: blocking   — gates the build when enabled; failure blocks unless a declared,
#                      auditable exception exists (.github/truenorth-exceptions.yaml, FR-13).
#   mode: advisory   — records findings that feed the error budget; never blocks.
#   enabled: false   — check does not run at all for this service (FR-10).
#   tier:  fast      — runs on every push (FR-16).
#   tier:  heavy     — runs only on explicit deep-scan trigger (FR-16).
#   plane: build|test — runner scale set routing.
#   applies: [stack] — applicability declaration (FR-58); "any" applies everywhere.

pipeline:
  module: ${{ values.daggerModule }}   # language-agnostic scans (pinned FR-14)
  registry: ${{ values.registry }}

planes:
  build: ${{ values.buildPlane }}
  test: ${{ values.testPlane }}

webhook:
  cit_handoff:
    enabled: false          # flip on when a CIT sink exists
    url: ""
    auth_secret: ""

checks:
  # ---- required class (day one, FR-58) ----
  secrets-scan:      { enabled: true, mode: required, tier: fast, plane: build, applies: [any] }
  pii-scan:          { enabled: true, mode: required, tier: fast, plane: build, applies: [any] }
  private-key-check: { enabled: true, mode: required, tier: fast, plane: build, applies: [any] }
  # ---- BUILD LEG (not a scan check): resolve -> build via dagger-checks-java.
  # DECLARED HOOKS: only the stages declared below run — presence-detection is
  # ignored. Single-line commands, run via bash -c in /src. Gradle repos MUST
  # declare hooks (the toolchain image ships maven only).
  build:
    enabled: true
    mode: blocking
    tier: fast
    plane: build
    applies: [java]
    module: ${{ values.buildModule }}
    hooks:
      # resolve: mvn -B -ntp dependency:go-offline
      build: mvn -B -ntp package
    # BUILD MATRIX (truenorth-v2.2): one parallel build pod per id; JAVA_VERSION
    # selects the temurin-<v> toolchain image. Build fails if ANY variant fails.
    # matrix:
    #   temurin-17: { env: { JAVA_VERSION: "17" } }
    #   temurin-21: { env: { JAVA_VERSION: "21" } }
  # test plane: the build leg runs the JUnit suite via `mvn package`; enable the
  # separate test check when the digest handoff (FR-18/19) lands for JARs.
  test:              { enabled: false, mode: blocking, tier: fast, plane: test,  applies: [any] }
  # ---- future: enable as advisory with grace period (FR-12), then flip to blocking ----
  lint:              { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }
  sast:              { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }
  format:            { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }
  coverage:          { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }
  sbom:              { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }

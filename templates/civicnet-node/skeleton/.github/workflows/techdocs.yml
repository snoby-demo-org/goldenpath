name: TechDocs Publish

# Thin caller — generation/publish logic lives in goldenpath's
# techdocs-reusable.yml (single source of truth; fixes land once for all repos).
# Docs follow the repository: authored as markdown (docs/), rendered + published
# on every merge to main. Entity ref is derived from this repo's catalog-info.yaml.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
      - '.github/workflows/techdocs*.yml'
  workflow_dispatch:

jobs:
  publish:
    uses: snoby-demo-org/goldenpath/.github/workflows/techdocs-reusable.yml@main
    with:
      runner: ${{ values.runnerLabel }}
    secrets:
      TECH_DOCS_ACCESS_KEY: ${{ secrets.TECH_DOCS_ACCESS_KEY }}
      TECH_DOCS_SECRET_KEY: ${{ secrets.TECH_DOCS_SECRET_KEY }}
      TECH_DOCS_S3_ENDPOINT: ${{ secrets.TECH_DOCS_S3_ENDPOINT }}

# TrueNorth pipeline configuration — scaffolded by the golden-path template
# (brownfield C/C++ onboarding; reference: cpuminer-opt-cpupower).
# Secrets/PII are required-class day one (FR-58/71, never deferrable); the
# C/C++ build check is blocking because the project has a canonical build that
# must compile a binary on every commit.
#
#   mode: required  — always on, hard-stops on failure (FR-59/71)
#   mode: blocking  — blocks unless a declared exception exists (FR-13)
#   mode: advisory  — feeds the error budget, never blocks (FR-59/60)

pipeline:
  module: ${{ values.pipelineModule }}   # language-agnostic scans (pinned FR-14)
  registry: ${{ values.registry }}

planes:
  build: ${{ values.runnerLabel }}
  test: ${{ values.runnerLabel }}

webhook:
  cit_handoff:
    enabled: false
    url: ""
    auth_secret: ""

checks:
  # ---- required class (day one, FR-58) ----
  secrets-scan:      { enabled: true, mode: required, tier: fast, plane: build, applies: [any] }
  pii-scan:          { enabled: true, mode: required, tier: fast, plane: build, applies: [any] }
  private-key-check: { enabled: true, mode: required, tier: fast, plane: build, applies: [any] }
  # ---- BUILD LEG (not a scan check): patch -> configure -> make via the
  # language module. DECLARED HOOKS (dagger-checks-c@v1.1.2): only the stages
  # declared below run — build.sh and generic stages are ignored. Fill these
  # in from this project's own build. The digest handoff is optional
  # (compile-only build produces a binary, not an image).
  build:
    enabled: true
    mode: blocking
    tier: fast
    plane: build
    applies: [c]
    module: github.com/snoby-demo-org/dagger-checks-c@v1.1.2
    # Declared build hooks — single-line commands, run via bash -c in /src
    # (set CFLAGS/CC/LDFLAGS inside the command). Example mirroring a typical
    # autotools build:
    hooks:
      autogen: ./autogen.sh
      configure: export CFLAGS="-O3 ${MARCH:+-march=${MARCH}} ${EXTRA_ARCH} -pthread -funroll-loops -fomit-frame-pointer -falign-functions=32 -falign-loops=32 -ftree-vectorize" LDFLAGS="-pthread -static-libstdc++ -static-libgcc"; ./configure --with-curl
      make: make clean && make -j"$(nproc)"
    # BUILD MATRIX (truenorth-v2.2): one parallel build pod per id; each runs
    # the full chain patch -> autogen -> configure -> make with env exported.
    # The build check fails if ANY variant fails. Example (note the ISA
    # contract — arch must imply AVX2 and AES/PCLMUL must be explicit):
    # matrix:
    #   amd-znver2:      { env: { MARCH: znver2 } }
    #   intel-broadwell: { env: { MARCH: broadwell, EXTRA_ARCH: "-maes -mpclmul" } }
  # ---- not applicable to this repo ----
  test:              { enabled: false, mode: blocking, tier: fast, plane: test,  applies: [any] }
  # ---- future: enable as advisory with grace period (FR-12), then flip to blocking ----
  lint:              { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }
  sast:              { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }
  format:            { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }
  coverage:          { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }
  sbom:              { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }

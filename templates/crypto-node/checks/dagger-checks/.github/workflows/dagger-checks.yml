name: Dagger Checks

# Config-driven golden-path pipeline. Reads .github/goldenpath.yaml and fans
# every enabled check out onto its OWN parallel runner pod, on the plane that
# the config assigns it to:
#
#   build-checks (matrix): every enabled build-plane check EXCEPT `build` =
#     one parallel ARC runner pod, own process / own engine session. Source
#     scans (lint, sast, pii-scan, format, private-key-check) launch
#     immediately in parallel — no dependency on the image build.
#   build (digest producer): pushes the real image to the zot registry and
#     captures its digest — the handoff contract to the test plane.
#   test-checks (matrix): every enabled test-plane check = one parallel ARC
#     runner pod, gated on the build producing a digest. No engine-cache dep.
#
# The matrix is built 100% from .github/goldenpath.yaml (the ONLY file a repo
# owns): every check listed there becomes one matrix element = one runner pod,
# running in parallel. Add/remove/enable/disable a check by editing
# goldenpath.yaml — never this file.
#
# Job-level context can't see step outputs, so the config is resolved in the
# `config` job and consumed via needs.config.outputs (JSON for the matrix).

permissions:
  # artifact handshake between live spans and the post-hoc export (actions:write upload / :read download)
  actions: write
  contents: read

env:
  # In-cluster OTel collector (otel namespace) -> Tempo. Outbound-only.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.otel.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  # LAB: export direct to in-cluster collector - skip the action's 80MB local otelcol download
  OTEL_SHELL_SKIP_LOCAL_COLLECTOR: "TRUE"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  config:
    runs-on: ${{ values.runnerLabel }}
    outputs:
      scan_checks: ${{ steps.cfg.outputs.scan_checks }}
      test_checks: ${{ steps.cfg.outputs.test_checks }}
      planes: ${{ steps.cfg.outputs.planes }}
      build_enabled: ${{ steps.cfg.outputs.build_enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Live per-job spans (queued -> in_progress -> steps -> completed) exported
      # DURING the run, outbound to the in-cluster OTel collector -> Tempo. No
      # inbound exposure; spans also carry traceparent for the post-hoc
      # workflow-level span to join the same trace.
      - name: OpenTelemetry job instrumentation
        uses: snoby/opentelemetry-github/actions/instrument/job@lab-patches
        with:
          github_token: ${{ github.token }}
          self_monitoring: false # lab-only: never phone home
          secrets_to_redact: '{"github_token": "${{ github.token }}"}'

      - name: Load goldenpath config
        id: cfg
        run: |
          python3 - <<'EOF'
          import yaml, os, json
          cfg = yaml.safe_load(open(".github/goldenpath.yaml"))
          checks = cfg.get("checks", {})
          planes = cfg.get("planes", {})
          enabled = {k: v for k, v in checks.items() if v.get("enabled")}
          # Every enabled build-plane check EXCEPT `build` becomes a parallel
          # scan pod. `build` is the digest producer (push + capture digest) —
          # it owns the handoff contract, so it is its own job, not in the matrix.
          scan_checks = [k for k, v in enabled.items() if v.get("plane") == "build" and k != "build"]
          test_checks = [k for k, v in enabled.items() if v.get("plane") == "test"]
          build_enabled = bool(enabled.get("build", {}).get("enabled"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"scan_checks={json.dumps(scan_checks)}\n")
              f.write(f"test_checks={json.dumps(test_checks)}\n")
              f.write(f"planes={json.dumps(planes)}\n")
              f.write(f"build_enabled={str(build_enabled).lower()}\n")
          print("build scan pods:", scan_checks)
          print("build producer :", build_enabled)
          print("test pods      :", test_checks)
          EOF

  # Every build-plane scan check = one parallel ARC runner pod (own process /
  # own engine session), all launched immediately, none waiting on `build`.
  # Source-scope scans have no `needs: build` — they start in parallel with it.
  build-checks:
    needs: config
    if: needs.config.outputs.scan_checks != '[]'
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.config.outputs.scan_checks) }}
    runs-on: ${{ fromJSON(needs.config.outputs.planes).build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OpenTelemetry job instrumentation
        uses: snoby/opentelemetry-github/actions/instrument/job@lab-patches
        with:
          github_token: ${{ github.token }}
          self_monitoring: false
          secrets_to_redact: '{"github_token": "${{ github.token }}"}'

      - name: Run check [${{ matrix.check }}]
        env:
          # Tag this check's trace with the GH run id + the check name so Tempo
          # can filter per-check traces per run, per job.
          OTEL_RESOURCE_ATTRIBUTES: "github.actions.workflow_run.id=${{ github.run_id }},github.actions.job.name=build/${{ matrix.check }},github.actions.commit=${{ github.sha }}"
        run: |
          dagger call --mod "${{ values.daggerModule }}" "${{ matrix.check }}" --source=.

  # Digest producer: builds the real image, pushes to the zot registry, captures
  # the real digest as the handoff artifact the test plane consumes. Launches in
  # parallel with the build-checks scan fan-out (no `needs: build-checks`).
  build:
    needs: config
    if: needs.config.outputs.build_enabled == 'true'
    runs-on: ${{ fromJSON(needs.config.outputs.planes).build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OpenTelemetry job instrumentation
        uses: snoby/opentelemetry-github/actions/instrument/job@lab-patches
        with:
          github_token: ${{ github.token }}
          self_monitoring: false
          secrets_to_redact: '{"github_token": "${{ github.token }}"}'

      - name: Build image and capture digest
        env:
          OTEL_RESOURCE_ATTRIBUTES: "github.actions.workflow_run.id=${{ github.run_id }},github.actions.job.name=build/build,github.actions.commit=${{ github.sha }}"
        run: |
          dagger call --mod "${{ values.daggerModule }}" build --source=. | tee digest.log
          grep -o 'sha256:[a-f0-9]*' digest.log | tail -1 > digest.txt
          echo "produced digest: $(cat digest.txt)"

      - name: Upload digest artifact (build -> test handoff)
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: digest.txt

  # Every test-plane check = one parallel ARC runner pod, gated on the build
  # plane having produced a digest. Unconditional on the individual scan results
  # (a failed scan does not cancel its siblings).
  test-checks:
    needs: [config, build]
    if: ${{ !cancelled() && needs.config.outputs.test_checks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.config.outputs.test_checks) }}
    runs-on: ${{ fromJSON(needs.config.outputs.planes).test }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OpenTelemetry job instrumentation
        uses: snoby/opentelemetry-github/actions/instrument/job@lab-patches
        with:
          github_token: ${{ github.token }}
          self_monitoring: false
          secrets_to_redact: '{"github_token": "${{ github.token }}"}'

      - name: Download digest handoff
        uses: actions/download-artifact@v4
        with:
          name: image-digest

      - name: Resolve image from registry
        run: echo "test plane pulls $(cat digest.txt 2>/dev/null || echo 'no digest') from zot.viporlab.net"

      - name: Run check [${{ matrix.check }}]
        env:
          OTEL_RESOURCE_ATTRIBUTES: "github.actions.workflow_run.id=${{ github.run_id }},github.actions.job.name=test/${{ matrix.check }},github.actions.commit=${{ github.sha }}"
        run: |
          dagger call --mod "${{ values.daggerModule }}" "${{ matrix.check }}" --source=.

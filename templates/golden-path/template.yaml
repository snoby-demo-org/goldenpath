apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: golden-path
  title: Golden Path (TrueNorth)
  description: >-
    Onboard an EXISTING repo onto the TrueNorth enforcement pipeline — opens a
    PR that adds .github/truenorth.yaml (check model FR-58 —
    required/blocking/advisory, declared build hooks + build matrix via the
    language Dagger module) plus the thin dagger-checks.yml caller pinned to
    goldenpath machinery, optional docs/TechDocs, and catalog registration.
    Reference onboarding shape — cpuminer-opt-cpupower (C) and
    spring-petclinic (Java). You review and merge the PR.
  tags:
    - truenorth
    - golden-path
    - onboarding
    - dagger
    - otel
    - github-actions
spec:
  owner: snoby
  type: service

  parameters:
    - title: Component
      required:
        - componentId
        - description
        - repoUrl
      properties:
        componentId:
          title: Component name
          type: string
          description: Unique catalog name for the component (lowercase, e.g. cpuminer-opt-cpupower)
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One-line description shown in the catalog
        owner:
          title: Owner
          type: string
          description: Catalog owner (group or user)
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        system:
          title: System
          type: string
          description: System the component belongs to (defaults to goldenpath)
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
          default: goldenpath

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Existing repository
          type: string
          description: >-
            The EXISTING repo to onboard. Golden path does NOT create it — it
            opens a PR adding the TrueNorth pipeline/docs/catalog-info onto the
            repo you already own.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - snoby
              - snoby-demo-org
        targetBranch:
          title: Target branch
          type: string
          description: Branch the golden-path PR targets (defaults to the repo default branch)
          default: main

    - title: TrueNorth pipeline
      description: The repo owns only .github/truenorth.yaml (its knowledge); the enforcement machinery lives once in goldenpath and is pinned by tag. Build hooks ship as commented examples — fill them from the project's own build after merging.
      properties:
        buildModule:
          title: Build language
          type: string
          description: Language-specific Dagger module the build check dispatches to
          default: github.com/snoby-demo-org/dagger-checks-java@v1.0.1
          oneOf:
            - const: github.com/snoby-demo-org/dagger-checks-java@v1.0.1
              title: Java (dagger-checks-java — maven toolchain, JDK matrix via JAVA_VERSION)
            - const: github.com/snoby-demo-org/dagger-checks-c@v1.1.2
              title: C/C++ (dagger-checks-c — autotools, target matrix via -march)
        pipelineModule:
          title: Pipeline (scan checks) module
          type: string
          description: Language-agnostic Dagger module for lint/sast/pii/secrets scans
          default: github.com/snoby-demo-org/dagger-checks@v1.0.6
        registry:
          title: Image registry
          type: string
          description: Registry the build (digest producer) pushes to
          default: zot.viporlab.net/demo
        runnerLabel:
          title: GitHub runner label
          type: string
          description: ARC self-hosted runner scale-set label for both planes
          default: k8s-runner
        checkDocs:
          title: Add docs/ + techdocs.yml (TechDocs to MinIO)
          type: boolean
          default: true

  steps:
    - id: fetchBase
      name: Fetch golden-path skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          componentId: ${{ parameters.componentId }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          repoUrl: ${{ parameters.repoUrl }}
          targetBranch: ${{ parameters.targetBranch }}

    - id: addTruenorthCaller
      name: Add TrueNorth caller workflow
      action: fetch:template
      input:
        url: ./checks/truenorth/caller
        copyWithoutTemplating:
          # The caller is full of GitHub Actions ${{ }} expressions the
          # template engine cannot parse — copy verbatim. The machinery pin
          # (truenorth-vN) is literal in the file; bumping it is the FR-14 flow.
          - .github/workflows/**

    - id: addTruenorthJava
      name: Add truenorth.yaml (Java build)
      if: ${{ parameters.buildModule === 'github.com/snoby-demo-org/dagger-checks-java@v1.0.1' }}
      action: fetch:template
      input:
        url: ./checks/truenorth/java
        values:
          pipelineModule: ${{ parameters.pipelineModule }}
          registry: ${{ parameters.registry }}
          runnerLabel: ${{ parameters.runnerLabel }}
          buildModule: ${{ parameters.buildModule }}

    - id: addTruenorthC
      name: Add truenorth.yaml (C/C++ build)
      if: ${{ parameters.buildModule === 'github.com/snoby-demo-org/dagger-checks-c@v1.1.2' }}
      action: fetch:template
      input:
        url: ./checks/truenorth/c
        values:
          pipelineModule: ${{ parameters.pipelineModule }}
          registry: ${{ parameters.registry }}
          runnerLabel: ${{ parameters.runnerLabel }}
          buildModule: ${{ parameters.buildModule }}

    - id: addDocs
      name: Add docs + TechDocs workflow
      if: ${{ parameters.checkDocs }}
      action: fetch:template
      input:
        url: ./checks/docs
        values:
          componentId: ${{ parameters.componentId }}
          description: ${{ parameters.description }}
          runnerLabel: ${{ parameters.runnerLabel }}

    - id: openPr
      name: Open golden-path PR
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: backstage-golden-path
        targetBranchName: ${{ parameters.targetBranch }}
        title: '[Backstage] TrueNorth — enforcement pipeline, docs, and catalog registration'
        description: |
          This PR (opened by the Backstage golden-path scaffolder) onboards this
          repo onto the TrueNorth enforcement pipeline:

          - `.github/workflows/dagger-checks.yml` — thin caller pinned to the
            goldenpath TrueNorth machinery (`truenorth-v2.1`); machinery is
            shared, this repo owns only its knowledge.
          - `.github/truenorth.yaml` — the ONLY pipeline file this repo owns:
            check selection, required/blocking/advisory modes, declared build
            hooks + build matrix. Fill in the hooks for this project's build
            (examples included for the chosen language module).
          - `.github/truenorth-exceptions.yaml` — create only when a blocking
            check needs a declared, auditable exception (FR-13).
          - `.github/workflows/techdocs.yml` + `docs/` + `mkdocs.yml` — publish
            docs to Backstage TechDocs (if docs enabled).
          - `catalog-info.yaml` — Backstage Component entity (catalog registration).

          Secrets/PII scans are required-class day one (never disableable);
          lint/sast/format start advisory so you can flip them to blocking on
          your own schedule (FR-12 progressive enforcement).

          Review and merge; the component will appear in Backstage after merge.

    - id: register
      name: Register component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.openPr.output.remoteUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Golden-path PR
        url: ${{ steps.openPr.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}

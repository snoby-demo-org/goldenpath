name: TrueNorth enforcement tests

# Machinery CI: the enforcement core (truenorth_report.py) is tested HERE,
# where it lives — callers no longer carry the file or its tests. The in-run
# unit-tests job in .github/workflows/truenorth.yml re-runs these against the
# pinned tag on every pipeline run as a belt-and-suspenders gate.

on:
  push:
    paths:
      - 'actions/truenorth-report/**'
      - '.github/workflows/truenorth.yml'
      - '.github/workflows/truenorth-tests.yml'
  pull_request:
    paths:
      - 'actions/truenorth-report/**'
      - '.github/workflows/truenorth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run enforcement unit tests
        run: python3 -m unittest discover -s actions/truenorth-report -p 'test_*.py' -v

name: TechDocs Publish (System)

# Thin caller — generation/publish logic lives in techdocs-reusable.yml so a
# fix lands once for every onboarded repo. Publishes this repo's OWN docs site
# under every entity kind defined here (system, domain, resource, api).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
      - '.github/workflows/techdocs*.yml'
  workflow_dispatch:

jobs:
  publish:
    uses: snoby-demo-org/goldenpath/.github/workflows/techdocs-reusable.yml@main
    with:
      entities: |
        default/system/civicnet-system
        default/domain/crypto
        default/resource/civicnet-node-data
        default/api/civicnet-node-rpc
    secrets:
      TECH_DOCS_ACCESS_KEY: ${{ secrets.TECH_DOCS_ACCESS_KEY }}
      TECH_DOCS_SECRET_KEY: ${{ secrets.TECH_DOCS_SECRET_KEY }}
      TECH_DOCS_S3_ENDPOINT: ${{ secrets.TECH_DOCS_S3_ENDPOINT }}

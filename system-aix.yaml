# aix system entity — owned by the ACI group. Onboarded components can set
# spec.system: aix to hang off this system in the catalog graph.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: aix
  title: aix
  description: aix — ACI-owned system.
spec:
  owner: group:default/aci
  domain: crypto

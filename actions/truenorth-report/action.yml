name: 'TrueNorth enforcement core'
description: >-
  Installs truenorth_report.py (blocks/flags/budget enforcement core) into the
  caller workspace at .github/truenorth_report.py, so reusable-workflow harness
  steps can `import truenorth_report` unchanged. Single machinery copy lives
  HERE in goldenpath — callers never carry this file.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        target="$GITHUB_WORKSPACE/.github/truenorth_report.py"
        mkdir -p "$(dirname "$target")"
        cp "$GITHUB_ACTION_PATH/truenorth_report.py" "$target"
        echo "truenorth-report: installed $(wc -l < "$target") lines from goldenpath@$GITHUB_ACTION_PATH"
        # Commit marker for dagger modules: dagger's directory sync EXCLUDES
        # .git, so modules can't `git rev-parse` the checkout. Write the sha to
        # a file the module reads for digest/staging tags (sha-<commit>).
        if git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$GITHUB_WORKSPACE/.truenorth_commit" 2>/dev/null; then
          echo "truenorth-report: commit marker $(cat "$GITHUB_WORKSPACE/.truenorth_commit")"
        fi

    # Dagger engine trust for the LAN registry (zot behind a self-signed CA).
    # `dagger call` auto-provisions an engine and injects ~/.config/dagger/
    # engine.json (v0.16+); `insecure: true` = HTTPS but skip cert verification,
    # so we don't have to bake the CA into every engine image. Only created if
    # absent — callers that already ship their own engine.json are untouched.
    - shell: bash
      run: |
        set -euo pipefail
        cfg="$HOME/.config/dagger/engine.json"
        if [ -f "$cfg" ]; then
          echo "truenorth-report: engine.json already present, leaving as-is"
        else
          mkdir -p "$(dirname "$cfg")"
          cat > "$cfg" <<'JSON'
        {
          "registries": {
            "registry.viporlab.net": { "insecure": true }
          }
        }
        JSON
          echo "truenorth-report: wrote $cfg (registry.viporlab.net insecure-skip-verify)"
        fi
